# Builds api_docs/ on every branch and pull request.
# Rendered output is stored as the api-docs artifact.
# Publishing to GitHub Pages is handled by .github/workflows/publish-api-docs.yml.
version: 2.1

jobs:
  build:
    docker:
      # -node variant: middleman-core loads ExecJS (CoffeeScript, uglifier)
      # at startup and needs a JavaScript runtime.
      - image: cimg/ruby:3.3-node
    environment:
      BUNDLE_PATH: vendor/bundle
      # RubyGems 4 runs `make -j<host cores + 1>` for native extensions unless
      # MAKEFLAGS already sets -j. The container sees the host's core count, so
      # the sassc/libsass compile fans out to dozens of compilers and exceeds
      # the 4 GB medium-class limit. Cap it to the class's 2 CPUs.
      MAKEFLAGS: -j2
    steps:
      - checkout
      - restore_cache:
          keys:
            - gems-v1-{{ checksum "api_docs/Gemfile.lock" }}
            - gems-v1-
      - run:
          name: Install gems
          working_directory: api_docs
          command: |
            gem install bundler -v 2.6.3
            bundle _2.6.3_ install --jobs=4
      - save_cache:
          key: gems-v1-{{ checksum "api_docs/Gemfile.lock" }}
          paths:
            - api_docs/vendor/bundle
      - run:
          name: Build docs
          working_directory: api_docs
          command: bundle _2.6.3_ exec middleman build --clean
      - store_artifacts:
          path: api_docs/build
          destination: api-docs

workflows:
  build:
    jobs:
      - build
